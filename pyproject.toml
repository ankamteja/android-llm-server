# Tooling config only — nothing here is installed on the phone, where the RAG
# scripts run against Termux's system Python with no third-party packages.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = [
  # ragcore/rag-web must import after sys.path is extended, since the device
  # has no package install step.
  "E402",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
